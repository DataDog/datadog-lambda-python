e2e-test:
  stage: e2e
  trigger:
    project: DataDog/serverless-e2e-tests
    strategy: depend
  rules:
    - if: '$SKIP_E2E_TESTS == "true"'
      when: never
    - when: on_success
  variables:
      LANGUAGES_SUBSET: python
      # These env vars are inherited from the dotenv reports of the publish-layer jobs
      PYTHON_38_VERSION: $PYTHON_38_VERSION
      PYTHON_39_VERSION: $PYTHON_39_VERSION
      PYTHON_310_VERSION: $PYTHON_310_VERSION
      PYTHON_311_VERSION: $PYTHON_311_VERSION
      PYTHON_312_VERSION: $PYTHON_312_VERSION
      PYTHON_313_VERSION: $PYTHON_313_VERSION
      PYTHON_314_VERSION: $PYTHON_314_VERSION
      PYTHON_315_VERSION: $PYTHON_315_VERSION
  needs:
      - "publish-layer-sandbox (python38-amd64): [us-west-2]"
      - "publish-layer-sandbox (python39-amd64): [us-west-2]"
      - "publish-layer-sandbox (python310-amd64): [us-west-2]"
      - "publish-layer-sandbox (python311-amd64): [us-west-2]"
      - "publish-layer-sandbox (python312-amd64): [us-west-2]"
      - "publish-layer-sandbox (python313-amd64): [us-west-2]"
      - "publish-layer-sandbox (python314-amd64): [us-west-2]"
      - "publish-layer-sandbox (python315-amd64): [us-west-2]"

e2e-test-status:
  stage: e2e
  image: registry.ddbuild.io/images/docker:20.10-py3
  tags: ["arch:amd64"]
  timeout: 3h
  rules:
    - if: '$SKIP_E2E_TESTS == "true"'
      when: never
    - when: on_success
  script: 
      - ci/poll_e2e.sh
