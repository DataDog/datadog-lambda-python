  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - $CI_PROJECT_DIR/.yarn-cache
  policy: pull

build-layer (python315-amd64):
  stage: build
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10
  artifacts:
    expire_in: 1 day # Unsigned zips expire in 1 day
    paths:
      - .layers/datadog_lambda_py-amd64-3.15.zip
  variables:
    CI_ENABLE_CONTAINER_IMAGE_BUILDS: "true"
  script:
    - PYTHON_VERSION=3.15 ARCH=amd64 ./scripts/build_layers.sh
  timeout: 15m
  retry: 2

check-layer-size (python315-amd64):
  stage: test
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10
  needs:
    - build-layer (python315-amd64)
  dependencies:
    - build-layer (python315-amd64)
  script:
    - PYTHON_VERSION=3.15 ARCH=amd64 ./scripts/check_layer_size.sh

lint python:
  stage: test
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/mirror/python:3.15.0
  cache: &python315-amd64-cache
  before_script:
    - PYTHON_VERSION=3.15 ARCH=amd64 IS_LINT="1" ./scripts/setup_python_env.sh
  script:
    - source venv/bin/activate
    - ./scripts/check_format.sh

unit-test (python315-amd64):
  stage: test
  tags:
  
      - "arch:amd64"
  
  image: registry.ddbuild.io/images/mirror/python:3.15.0
  cache: &python315-amd64-cache
  variables:
    DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
    DD_SERVICE: "datadog-lambda-python"
    DD_ENV: "ci"
    DD_TAGS: "python_version:3.15,arch:amd64"
  before_script:
    - GET_SECRETS_API_KEY_ONLY=1 source ./ci/get_secrets.sh
    - PYTHON_VERSION=3.15 ARCH=amd64 ./scripts/setup_python_env.sh
  script:
    - set -e
    - source venv/bin/activate
    - pytest -vv --ddtrace
  retry: 2

integration-test (python315-amd64):
  stage: test
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10-py3
  rules:
    - if: '$SKIP_E2E_TESTS == "true"'
      when: never
    - when: on_success
  needs:
    - build-layer (python315-amd64)
  dependencies:
    - build-layer (python315-amd64)
  cache: &python315-amd64-cache
  variables:
    CI_ENABLE_CONTAINER_IMAGE_BUILDS: "true"
  before_script:
    - *install-node
    - EXTERNAL_ID_NAME=integration-test-externalid ROLE_TO_ASSUME=sandbox-integration-test-deployer AWS_ACCOUNT=425362996713 source ./ci/get_secrets.sh
    - yarn global add serverless@^3.38.0 --prefix /usr/local
    - yarn global add serverless-python-requirements@^6.1.1 --prefix /usr/local
    - cd integration_tests && yarn install && cd ..
  script:
    - RUNTIME_PARAM=3.15 ARCH=amd64 ./scripts/run_integration_tests.sh
  retry: 2

sign-layer (python315-amd64):
  stage: sign
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10-py3
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual
  needs:
    - build-layer (python315-amd64)
    - check-layer-size (python315-amd64)
    - lint python
    - unit-test (python315-amd64)
    - integration-test (python315-amd64)
  dependencies:
    - build-layer (python315-amd64)
  artifacts: # Re specify artifacts so the modified signed file is passed
    expire_in: 1 day # Signed layers should expire after 1 day
    paths:
      - .layers/datadog_lambda_py-amd64-3.15.zip
  before_script:
    - apt-get update
    - apt-get install -y uuid-runtime
    
    - EXTERNAL_ID_NAME=prod-publish-externalid ROLE_TO_ASSUME=dd-serverless-layer-deployer-role AWS_ACCOUNT=464622532012 source ./ci/get_secrets.sh
    
  script:
    - LAYER_FILE=datadog_lambda_py-amd64-3.15.zip ./scripts/sign_layers.sh prod




publish-layer-prod (python315-amd64):
  stage: publish
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10-py3
  rules:
    - if: '$SKIP_E2E_TESTS == "true"'
      when: never
    - if: '"prod" == "sandbox" && $REGION == "us-west-2" && "amd64" == "amd64"'
      when: on_success
    - if: '"prod" == "sandbox"'
