stages:
 - build
 - test
 - sign
 - publish
 - e2e

default:
  retry:
    max: 1
    when:
      # Retry when the runner fails to start
      - runner_system_failure

# This is for serverless framework
.install-node: &install-node
  - apt-get update
  - apt-get install -y ca-certificates curl gnupg xxd
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  # We are explicitly setting the node_20.x version for the installation
  - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
  - apt-get update
  - apt-get install nodejs -y
  - npm install --global yarn





# TODO(astuyve) - figure out python build cache
.python38-amd64-cache: &python38-amd64-cache
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - $CI_PROJECT_DIR/.yarn-cache
  policy: pull

build-layer (python38-amd64):
  stage: build
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10
  artifacts:
    expire_in: 1 day # Unsigned zips expire in 1 day
    paths:
      - .layers/datadog_lambda_py-amd64-3.8.zip
  variables:
    CI_ENABLE_CONTAINER_IMAGE_BUILDS: "true"
  script:
    - PYTHON_VERSION=3.8 ARCH=amd64 ./scripts/build_layers.sh
  timeout: 15m
  retry: 2

check-layer-size (python38-amd64):
  stage: test
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10
  needs:
    - build-layer (python38-amd64)
  dependencies:
    - build-layer (python38-amd64)
  script:
    - PYTHON_VERSION=3.8 ARCH=amd64 ./scripts/check_layer_size.sh

lint python:
  stage: test
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/mirror/python:3.8
  cache: &python38-amd64-cache
  before_script:
    - PYTHON_VERSION=3.8 ARCH=amd64 IS_LINT="1" ./scripts/setup_python_env.sh
  script:
    - source venv/bin/activate
    - ./scripts/check_format.sh

unit-test (python38-amd64):
  stage: test
  tags:
  
      - "arch:amd64"
  
  image: registry.ddbuild.io/images/mirror/python:3.8
  cache: &python38-amd64-cache
  variables:
    DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
    DD_SERVICE: "datadog-lambda-python"
    DD_ENV: "ci"
    DD_TAGS: "python_version:3.8,arch:amd64"
  before_script:
    - GET_SECRETS_API_KEY_ONLY=1 source ./ci/get_secrets.sh
    - PYTHON_VERSION=3.8 ARCH=amd64 ./scripts/setup_python_env.sh
  script:
    - set -e
    - source venv/bin/activate
    - pytest -vv --ddtrace
  retry: 2

integration-test (python38-amd64):
  stage: test
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10-py3
  rules:
    - if: '$SKIP_E2E_TESTS == "true"'
      when: never
    - when: on_success
  needs:
    - build-layer (python38-amd64)
  dependencies:
    - build-layer (python38-amd64)
  cache: &python38-amd64-cache
  variables:
    CI_ENABLE_CONTAINER_IMAGE_BUILDS: "true"
  before_script:
    - *install-node
    - EXTERNAL_ID_NAME=integration-test-externalid ROLE_TO_ASSUME=sandbox-integration-test-deployer AWS_ACCOUNT=425362996713 source ./ci/get_secrets.sh
    - yarn global add serverless@^3.38.0 --prefix /usr/local
    - yarn global add serverless-python-requirements@^6.1.1 --prefix /usr/local
    - cd integration_tests && yarn install && cd ..
  script:
    - RUNTIME_PARAM=3.8 ARCH=amd64 ./scripts/run_integration_tests.sh
  retry: 2

sign-layer (python38-amd64):
  stage: sign
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10-py3
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual
  needs:
    - build-layer (python38-amd64)
    - check-layer-size (python38-amd64)
    - lint python
    - unit-test (python38-amd64)
    - integration-test (python38-amd64)
  dependencies:
    - build-layer (python38-amd64)
  artifacts: # Re specify artifacts so the modified signed file is passed
    expire_in: 1 day # Signed layers should expire after 1 day
    paths:
      - .layers/datadog_lambda_py-amd64-3.8.zip
  before_script:
    - apt-get update
    - apt-get install -y uuid-runtime
    
    - EXTERNAL_ID_NAME=prod-publish-externalid ROLE_TO_ASSUME=dd-serverless-layer-deployer-role AWS_ACCOUNT=464622532012 source ./ci/get_secrets.sh
    
  script:
    - LAYER_FILE=datadog_lambda_py-amd64-3.8.zip ./scripts/sign_layers.sh prod




publish-layer-prod (python38-amd64):
  stage: publish
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/docker:20.10-py3
  rules:
    - if: '$SKIP_E2E_TESTS == "true"'
      when: never
    - if: '"prod" == "sandbox" && $REGION == "us-west-2" && "amd64" == "amd64"'
      when: on_success
    - if: '"prod" == "sandbox"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  artifacts:
    reports:
      dotenv: python38_amd64_prod.env
  needs:

      - sign-layer (python38-amd64)

  dependencies:

      - sign-layer (python38-amd64)

  parallel:
    matrix:
      - REGION: 
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - af-south-1
          - ap-east-1
          - ap-east-2
          - ap-south-1
          - ap-south-2
          - ap-southeast-1
          - ap-southeast-2
          - ap-southeast-3
          - ap-southeast-4
          - ap-southeast-5
          - ap-southeast-6
          - ap-southeast-7
          - ap-northeast-1
          - ap-northeast-2
          - ap-northeast-3
          - ca-central-1
          - ca-west-1
          - eu-central-1
          - eu-central-2
          - eu-north-1
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-south-1
          - eu-south-2
          - il-central-1
          - me-central-1
          - mx-central-1
          - sa-east-1
  before_script:
    - EXTERNAL_ID_NAME=prod-publish-externalid ROLE_TO_ASSUME=dd-serverless-layer-deployer-role AWS_ACCOUNT=464622532012 source ./ci/get_secrets.sh
  script:
    - STAGE=prod PYTHON_VERSION=3.8 ARCH=amd64 DOTENV=python38_amd64_prod.env ./ci/publish_layers.sh


