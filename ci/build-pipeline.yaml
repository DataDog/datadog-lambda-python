          - ap-northeast-3
          - ca-central-1
          - ca-west-1
          - eu-central-1
          - eu-central-2
          - eu-north-1
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-south-1
          - eu-south-2
          - il-central-1
          - me-central-1
          - mx-central-1
          - sa-east-1
  before_script:
    - EXTERNAL_ID_NAME=prod-publish-externalid ROLE_TO_ASSUME=dd-serverless-layer-deployer-role AWS_ACCOUNT=464622532012 source ./ci/get_secrets.sh
  script:
    - STAGE=prod PYTHON_VERSION=3.15 ARCH=amd64 DOTENV=python315_amd64_prod.env ./ci/publish_layers.sh


