name: build

on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: '0 0,12 * * *' # Runs every day at midnight and noon utc

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install .[dev]

      - name: Check formatting
        run: |
          source venv/bin/activate
          ./scripts/check_format.sh

      - name: Lint
        run: |
          source venv/bin/activate
          flake8 datadog_lambda/

  python-versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.load.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Load Python versions
        id: load
        run: |
          source ./scripts/python_versions.sh
          load_python_versions
          echo "versions=$(python_versions_json)" >> "$GITHUB_OUTPUT"

  unit-test:
    needs: python-versions
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install .[dev]

      - name: Run tests
        run: |
          source venv/bin/activate
          pytest -vv
